<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf6ee">
  <meta name="description" content="Christmas Carol Choir: prova le voci SATB dei canti di Natale.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Carol Choir">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Christmas Carol Choir</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/im-fell-english.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/eb-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="appearance.js"></script>
  <script src="i18n.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="vendor/abcjs-basic-6.7.2.min.js" defer></script>
  <script src="notation.js" defer></script>
  <script src="sounds.js" defer></script>
  <script src="booklet.js" defer></script>
  <script src="playlist.js" defer></script>
  <script src="player.js" defer></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Vai al contenuto</a>
<header class="appbar">
  <a class="brand" href="#/playlist"><span class="brand-tile" aria-hidden="true">🎄</span><span class="brand-name">Christmas Carol Choir</span></a>
  <nav class="tabs" aria-label="Sezioni" data-label="sections">
    <a href="#/playlist" data-nav="albums"><svg class="ic" aria-hidden="true"><use href="icons.svg#headphones"/></svg><span data-i18n="recordings">Playlist</span></a>
    <a href="#/brani" data-nav="library"><svg class="ic" aria-hidden="true"><use href="icons.svg#score"/></svg><span data-i18n="scores">Spartiti</span></a>
    <a href="#/pdf" data-nav="booklet"><svg class="ic" aria-hidden="true"><use href="icons.svg#doc"/></svg><span>PDF</span></a>
  </nav>
  <button id="theme" class="icon-btn" type="button"><svg class="ic" aria-hidden="true"><use href="icons.svg#theme"/></svg></button>
</header>
<p id="error" role="alert" hidden></p>

<main id="main">
  <!-- No home: the tabs are the menu and the app opens on the playlists. -->
  <section id="albums-panel" class="page" data-view="albums" aria-labelledby="albums-title">
    <h1 id="albums-title" class="sr-only" data-i18n="recordings">Playlist</h1>
    <h2 class="sr-only" data-i18n="fullPlaylist">Playlist completa</h2>
    <ul id="album-full" class="albums albums-full"></ul>
    <h2 class="section-title"><span class="sr-only" data-i18n="voicePlaylists">Playlist per voce</span></h2>
    <ul id="album-list" class="albums"></ul>
  </section>

  <section id="playlist-panel" class="page" data-view="playlist" aria-labelledby="playlist-title" hidden>
    <header class="pl-head">
      <div id="playlist-cover" class="pl-cover"></div>
      <div class="pl-meta">
        <h1 id="playlist-title" class="sr-only"></h1>
        <p id="playlist-detail" class="pl-detail"></p>
        <button id="playlist-play" class="btn-primary" type="button"><svg class="ic when-paused" aria-hidden="true"><use href="icons.svg#play"/></svg><svg class="ic when-playing" aria-hidden="true"><use href="icons.svg#pause"/></svg><span class="label"></span></button>
      </div>
    </header>
    <ol id="playlist-tracks" class="index"></ol>
  </section>

  <section id="library-panel" class="page" data-view="library" aria-labelledby="library-title" hidden>
    <h1 id="library-title" class="sr-only" data-i18n="interactive">Spartiti interattivi</h1>
    <ol id="song-list" class="index"></ol>
  </section>

  <section id="practice-panel" class="practice" data-view="practice" aria-label="Spartito interattivo" data-label="practice" hidden>
    <header class="score-head">
      <a class="icon-btn back" href="#/brani" data-label="backToLibrary" aria-label="Torna ai brani"><svg class="ic" aria-hidden="true"><use href="icons.svg#back"/></svg></a>
      <div class="score-titles">
        <p class="kicker"><span id="verse-now"></span><span id="section-name"></span></p>
        <h1 id="song-title"></h1>
      </div>
      <div class="head-tools">
        <button id="zoom-out" class="icon-btn desk" type="button" data-label="zoomOut" aria-label="Riduci spartito"><svg class="ic" aria-hidden="true"><use href="icons.svg#minus"/></svg></button>
        <button id="zoom-in" class="icon-btn desk" type="button" data-label="zoomIn" aria-label="Ingrandisci spartito"><svg class="ic" aria-hidden="true"><use href="icons.svg#plus"/></svg></button>
        <button id="options-button" class="icon-btn opts" type="button" aria-controls="selection" aria-expanded="false" data-label="options" aria-label="Voci e strofa"><svg class="ic" aria-hidden="true"><use href="icons.svg#sliders"/></svg></button>
      </div>
    </header>
    <!-- Inline on large screens; on phones a bottom sheet, so the staves and the words keep the height. -->
    <section id="selection" class="controls" aria-label="Voci e strofa" data-label="options">
      <div class="sheet-head"><h2 data-i18n="options">Voci e strofa</h2><button class="icon-btn" type="button" data-close data-label="close" aria-label="Chiudi"><svg class="ic" aria-hidden="true"><use href="icons.svg#close"/></svg></button></div>
      <div class="voice-group">
        <div id="voices" class="voices" role="group" data-label="voicesHint" aria-label="Voci"></div>
        <span id="voice-label" class="voice-label"></span>
      </div>
      <div id="verse-group" class="verse-group"><div id="verses" class="verses" role="group" data-label="verse" aria-label="Strofa"></div></div>
      <div class="option-row">
        <button id="slow" class="toggle" type="button" aria-pressed="false" data-label="slowTitle"><svg class="ic" aria-hidden="true"><use href="icons.svg#metronome"/></svg><span data-i18n="slow">Lento</span></button>
        <div id="sound-control" class="segmented" role="group" data-label="sound" aria-label="Suono" hidden>
          <button id="sound-choir" type="button" aria-pressed="true" data-i18n="soundChoir">Coro</button><button id="sound-piano" type="button" aria-pressed="false" data-i18n="soundPiano">Pianoforte</button>
        </div>
        <div class="stepper" role="group" data-label="transpose" aria-label="Trasposizione">
          <button id="transpose-down" type="button" data-label="transposeDown" aria-label="Abbassa di un semitono"><svg class="ic" aria-hidden="true"><use href="icons.svg#minus"/></svg></button>
          <output id="transpose-value" aria-live="polite"></output>
          <button id="transpose-up" type="button" data-label="transposeUp" aria-label="Alza di un semitono"><svg class="ic" aria-hidden="true"><use href="icons.svg#plus"/></svg></button>
        </div>
        <a id="download" class="toggle" download><svg class="ic" aria-hidden="true"><use href="icons.svg#download"/></svg><span>PDF</span></a>
      </div>
      <label id="organ-control" class="organ" hidden><span data-i18n="organVolume">Volume base</span> <output id="organ-value">100%</output><input id="organ-volume" type="range" min="0" max="150" step="10" value="100"></label>
    </section>
    <div id="score-viewport" class="stage" tabindex="0" data-label="scoreScroll" aria-label="Spartito: scorri orizzontalmente">
      <div id="score" class="stage-sheet"><div class="notation"></div><div class="cursor" aria-hidden="true"></div></div>
    </div>
    <div id="lyric-rows" class="lyrics"></div>
  </section>

  <section id="booklet-panel" class="page booklet" data-view="booklet" aria-labelledby="booklet-title" hidden>
    <h1 id="booklet-title" class="sr-only" data-i18n="booklet">Genera PDF</h1>
    <label class="select-all"><span data-i18n="selectAll">Seleziona tutti</span><input id="booklet-all" class="song-check" type="checkbox"></label>
    <ol id="booklet-list" class="index"></ol>
  </section>
</main>

<section class="dock player-dock" aria-label="Riproduzione" data-label="playback" hidden>
  <div class="dock-inner">
    <button id="play" class="play-btn" type="button" data-label="play" aria-label="Ascolta" disabled><svg class="ic when-paused" aria-hidden="true"><use href="icons.svg#play"/></svg><svg class="ic when-playing" aria-hidden="true"><use href="icons.svg#pause"/></svg><span class="count" aria-hidden="true"></span></button>
    <span id="time" class="time">0:00</span>
    <input id="seek" type="range" min="0" max="100" step="0.01" value="0" data-label="seek" aria-label="Posizione di riproduzione">
    <span id="total" class="time">0:00</span>
  </div>
  <span id="position" class="sr-only" role="status" aria-live="polite"></span>
</section>

<section class="dock make-bar" aria-label="Genera PDF" data-label="booklet" hidden>
  <div class="dock-inner">
    <label class="even"><input id="booklet-even" class="song-check" type="checkbox" checked><span><span data-i18n="evenPages">Pagine pari</span><small data-i18n="evenHint">Fronte‑retro: ogni brano inizia a destra</small></span></label>
    <span id="booklet-status" class="status" aria-live="polite"></span>
    <button id="booklet-make" class="btn-primary" type="button" disabled><svg class="ic" aria-hidden="true"><use href="icons.svg#download"/></svg><span data-i18n="booklet">Genera PDF</span></button>
  </div>
</section>

<section id="mini-player" class="mini" aria-label="Playlist in riproduzione" data-label="nowPlaying" hidden>
  <input id="mini-seek" type="range" min="0" max="1" step="0.1" value="0" data-label="seek" aria-label="Posizione nel brano">
  <a id="mini-open" class="mini-info" href="#/playlist"><span id="mini-cover" class="mini-art" aria-hidden="true"></span><span class="mini-copy"><span id="mini-title" class="mini-title"></span><span id="mini-status" class="mini-sub"></span></span></a>
  <div class="mini-buttons">
    <button id="mini-previous" class="icon-btn" type="button" data-label="previousSong" aria-label="Brano precedente"><svg class="ic" aria-hidden="true"><use href="icons.svg#prev"/></svg></button>
    <button id="mini-play" class="icon-btn mini-play" type="button" data-label="play" aria-label="Ascolta"><svg class="ic when-paused" aria-hidden="true"><use href="icons.svg#play"/></svg><svg class="ic when-playing" aria-hidden="true"><use href="icons.svg#pause"/></svg></button>
    <button id="mini-next" class="icon-btn" type="button" data-label="nextSong" aria-label="Brano successivo"><svg class="ic" aria-hidden="true"><use href="icons.svg#next"/></svg></button>
    <button id="mini-close" class="icon-btn" type="button" data-label="stopPlaylist" aria-label="Interrompi la riproduzione"><svg class="ic" aria-hidden="true"><use href="icons.svg#close"/></svg></button>
  </div>
</section>
<div class="scrim" aria-hidden="true"></div>
</body>
</html>
