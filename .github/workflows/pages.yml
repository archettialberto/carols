# Publishes the static app to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The playlist tracks (play-*, play-lead-*, choir.m4a) are not committed: they are built here
      # from the committed parts and spoken titles, exactly as `tools/recordings.py build` does locally.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install numpy
      - run: python tools/recordings.py build
      # Validates every song, then writes site/ (the committed PDFs are reused, no browser needed).
      - run: python -m unittest discover -s tests
      - run: python tools/build_static.py
      # A unique name per attempt: re-running a job otherwise leaves two "github-pages"
      # artifacts in the same run and deploy-pages refuses to choose.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
